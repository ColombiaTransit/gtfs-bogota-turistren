name: One-time OSM rail shape candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract connected railway line from OSM via Overpass
        run: python scripts/one_time_osm_shape.py
      - uses: actions/upload-artifact@v4
        with:
          name: turistren-osm-shape-candidate
          path: candidate-rail-shape.geojson
          if-no-files-found: error
