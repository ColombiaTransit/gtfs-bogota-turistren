name: Build and validate GTFS
on:
  push:
    branches: [main]
    paths:
      - 'build_gtfs.py'
      - 'requirements.txt'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/build-validate-release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release only after validation and verified OSM geometry'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: turistren-gtfs-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Build one-year schedule
        run: python build_gtfs.py --start 2026-11-15 --end 2027-11-14
      - name: Get pinned MobilityData validator v8.0.1
        run: |
          curl -fL --retry 3 -o validator.jar https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          echo '19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  validator.jar' | sha256sum -c -
      - name: Run MobilityData GTFS Validator
        run: java -jar validator.jar -i dist/turistren-gtfs.zip -o validation -c co
      - name: Require no validator errors
        run: python scripts/check_validation.py
      - name: Archive GTFS + validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turistren-build-and-validation
          path: |
            dist/turistren-gtfs.zip
            validation/
          if-no-files-found: warn
      - name: Require static verified OSM shape before release
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: |
          test -s data/rail_shape.geojson || { echo 'Publish blocked: verified static OSM rail geometry missing'; exit 1; }
      - name: Publish validated release to stable tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="latest"
          FILE="dist/turistren-gtfs.zip"

          # Repoint the stable release tag to the commit that passed validation.
          # Use the GitHub API so no git force-push credential setup is required.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          fi

          # Update the existing release and overwrite its asset, or create it
          # when publishing for the first time. The download URL never changes.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILE}" --clobber
            gh release edit "${TAG}" --title "Turistren GTFS (latest)" \
              --notes "Validated by MobilityData GTFS Validator v8.0.1. GTFS service window: 2026-11-15 to 2027-11-14." --latest
          else
            gh release create "${TAG}" "${FILE}" \
              --title "Turistren GTFS (latest)" \
              --notes "Validated by MobilityData GTFS Validator v8.0.1. GTFS service window: 2026-11-15 to 2027-11-14." --latest
          fi
